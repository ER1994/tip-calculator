<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="./images/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <title>Tip calculator app</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="variables.css" rel="stylesheet">
    <link href="main.css" rel="stylesheet">
    <script defer src='calculations.js'></script>
</head>
<body>
<img src="images/logo.svg">
<form id="calculations-forms">
    <div class="input-section">
        <fieldset>
            <label for="bill">Bill</label>
            <input class="validation" id="bill" name="bill" step="0.01" type="text" value=0>
        </fieldset>
        <fieldset class="tip-section">
            <legend>Select Tip %</legend>
            <div class="tip-rates">
                <button class="tip-btn" data-rate='0.05' type="button">5%</button>
                <button class="tip-btn" data-rate='0.1' type="button">10%</button>
                <button class="tip-btn" data-rate='0.15' type="button">15%</button>
                <button class="tip-btn" data-rate='0.25' type="button">25%</button>
                <button class="tip-btn" data-rate='0.5' type="button">50%</button>
                <input class="tip-input" id="custom" name="custom" placeholder="Custom" type="text">
            </div>
        </fieldset>
        <fieldset>
            <div class="people-wrapper">
                <label for="people">Number of People</label>
                <p class="error-message__inactive">Can't be zero</p>
            </div>
            <input class="validation" id="people" name="people" step="1" type="text" value=0>
        </fieldset>
    </div>
    <div class="output-section">
        <div class="output-container">
            <fieldset>
                <label for="result-tip">
                    Tip Amount<br><span class="sub"> / person</span>
                </label>
                <output id="result-tip" name="result-tip">$0.00</output>
            </fieldset>
            <fieldset>
                <label for="result-total">
                    Total<br><span class="sub"> / person</span></label>
                <output id="result-total" name="result-total">$0.00</output>
            </fieldset>
        </div>
        <button class="reset" id="reset" type="reset">RESET</button>
    </div>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="./images/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <title>Tip calculator app</title>
    <script src = 'calculations.js' defer></script>
</head>
<body>
<form id="calculations-forms">
    <div class="input-section">
        <fieldset>
            <label for="bill">Bill</label>
            <input id="bill" name="bill" type="number" placeholder="0" step="0.01">
        </fieldset>
        <fieldset>
            <legend>Select Tip %</legend>
            <button type="button" class="tip-btn" data-rate = '0.05'>5%</button>
            <button type="button" class="tip-btn" data-rate = '0.1'>10%</button>
            <button type="button" class="tip-btn" data-rate = '0.15'>15%</button>
            <button type="button" class="tip-btn" data-rate = '0.25'>25%</button>
            <button type="button" class="tip-btn" data-rate = '0.5'>50%</button>
            <input type="number" name="custom" id="custom" class="tip-input" placeholder="Custom">
        </fieldset>
        <fieldset>
            <label for="people">Number of People</label>
            <input id="people" name="people" type="number" step="1" placeholder="0">
        </fieldset>
    </div>
    <div class="output-section">
        <fieldset>
            <label for="result-tip">Tip Amount / person</label>
            <output id="result-tip"  name="result-tip"></output>
            <label for="result-total">Total / person</label>
            <output id="result-total" name="result-total"></output>
            <button type="reset">Reset</button>
        </fieldset>
    </div>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="./images/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <title>Tip calculator app</title>
</head>
<body>
<form>
    <div class="input-section">
        <fieldset>
            <label for="bill">Bill</label>
            <input id="bill" name="bill" type="number">
        </fieldset>
        <fieldset>
            <legend>Select Tip %</legend>
            <button type="button">5%</button>
            <button type="button">10%</button>
            <button type="button">15%</button>
            <button type="button">25%</button>
            <button type="button">50%</button>
            <input type="text" name="custom" id="custom">
        </fieldset>
        <fieldset>
            <label>Number of People</label>
            <input id="people" name="people" type="number">
        </fieldset>
    </div>
    <div class="output-section">
        <fieldset>
            <label>Tip Amount / person</label>
            <output name="result-tip"></output>
            <label>Total / person</label>
            <output name="result-total"></output>
            <button type="reset">Reset</button>
        </fieldset>
    </div>
</form>
</body>
</html>
